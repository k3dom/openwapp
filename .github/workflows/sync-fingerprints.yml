name: Sync fingerprints
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: Sync fingerprints
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open/update the sync PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync with upstream
        id: sync
        run: |
          previous="$(jq -r .commit packages/fingerprints/data/upstream.json)"
          packages/fingerprints/scripts/sync.sh
          commit="$(jq -r .commit packages/fingerprints/data/upstream.json)"

          if git diff --quiet -- packages/fingerprints/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compare="https://github.com/enthec/webappanalyzer/compare/$previous...$commit"
          printf -- '---\n"@openwapp/fingerprints": patch\n---\n\nSync with [enthec/webappanalyzer@%s](%s).\n' \
            "${commit:0:7}" "$compare" > ".changeset/fingerprints-${commit:0:7}.md"

          {
            echo "changed=true"
            echo "short=${commit:0:7}"
            echo "compare=$compare"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync-fingerprints
          delete-branch: true
          commit-message:
            'feat(fingerprints): sync with enthec/webappanalyzer@${{
            steps.sync.outputs.short }}'
          title:
            'feat(fingerprints): sync with enthec/webappanalyzer@${{
            steps.sync.outputs.short }}'
          body: |
            Syncs the fingerprints with upstream.

            Changes: ${{ steps.sync.outputs.compare }}
