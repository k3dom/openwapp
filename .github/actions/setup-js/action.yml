name: Setup JS
description: Sets up PNPM, Node and installs dependencies

runs:
  using: composite
  steps:
    - name: Setup pnpm and Node.js
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        runtime: node@26
        cache: true
        require-lockfile: true
